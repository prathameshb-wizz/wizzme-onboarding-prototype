<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WizzMe · Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Inter:wght@400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#EEF4FF; --dim:rgba(220,232,255,.66); --faint:rgba(220,232,255,.42);
    --glass:rgba(255,255,255,.08); --glass2:rgba(255,255,255,.13);
    --stroke:rgba(255,255,255,.17); --stroke2:rgba(255,255,255,.34);
    --glow:rgba(96,150,255,.5); --ok:#8FE8C4;
    --box:rgba(255,255,255,.11); --box-sh:0 4px 16px rgba(0,0,0,.22);
    --accent:#4f7ae6; --accent-ink:#fff; --accent-sh:rgba(96,150,255,.42);
    --bg1:#08133c; --bg2:#0a1638; --bg3:#060f2c;
    --wv1:#5f8ff0; --wv2:#4f7fe6; --wv3:#79cfff; --wv4:#6fa0ff; --vg:rgba(6,10,26,.5);
    --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);overflow:hidden;background:radial-gradient(95% 75% at 50% 16%,#132455 0%,#0a1231 46%,#05091e 100%)}
  button{font-family:inherit}
  .hidden{display:none!important}

  .top{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(4,8,26,.6);backdrop-filter:blur(12px)}
  .top .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:400;font-size:19px}
  .top .brand small{font-family:var(--sans);font-size:11px;color:var(--faint);letter-spacing:.04em}
  .toggle{display:flex;gap:4px;background:var(--glass);border:1px solid var(--stroke);border-radius:999px;padding:4px}
  .toggle button{border:none;background:transparent;color:var(--dim);font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:7px}
  .toggle button.on{background:var(--glass2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--stroke)}
  .top .right{display:flex;gap:8px;align-items:center}
  .tbtn{border:1px solid var(--stroke);background:var(--glass);color:var(--dim);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
  .tbtn:hover{color:var(--ink);border-color:var(--stroke2)}

  /* vertical sidebar shell */
  .shell{display:flex;height:100vh}
  .side{width:236px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.08);background:rgba(5,10,30,.5);backdrop-filter:blur(14px);padding:26px 18px;display:flex;flex-direction:column;gap:26px;z-index:30}
  .side .brand{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-weight:400;font-size:19px}
  .side .brand small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--faint);letter-spacing:.05em;margin-top:2px}
  .side-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:11px}
  .vtoggle{display:flex;flex-direction:column;gap:4px;background:var(--glass);border:1px solid var(--stroke);border-radius:14px;padding:5px}
  .vtoggle button{border:none;background:transparent;color:var(--dim);font-size:13.5px;font-weight:600;padding:11px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:.2s}
  .vtoggle button.on{background:var(--glass2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--stroke)}
  .palgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pal{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:11px;cursor:pointer;font-size:12px;font-weight:600;color:rgba(228,234,255,.72);transition:.2s}
  .pal:hover{color:#fff;border-color:rgba(255,255,255,.28)}
  .pal.on{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.24)}
  .pal .dot{width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
  .vsteps{display:flex;flex-direction:column;gap:2px}
  .vsteps button{display:flex;align-items:center;gap:11px;padding:10px;border:none;background:transparent;color:var(--faint);font-size:13.5px;font-weight:600;cursor:pointer;border-radius:12px;text-align:left;width:100%;transition:.2s}
  .vsteps button:hover{background:var(--glass);color:var(--dim)}
  .vsteps button.active{background:var(--glass2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--stroke)}
  .vsteps button.done{color:var(--dim)}
  .vsteps .n{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
  .vsteps button.done .n{background:var(--ok);border-color:var(--ok);color:#06371f}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .main{flex:1;position:relative}
  .assetnote{font-size:11px;color:var(--faint);padding:6px 22px;text-align:center;background:rgba(255,255,255,.02);border-bottom:1px solid rgba(255,255,255,.05)}
  .assetnote b{color:var(--ok)}

  .pips{position:relative;z-index:30;display:flex;justify-content:center;padding:10px}
  .pipsInner{display:inline-flex;gap:2px;background:var(--glass);border:1px solid var(--stroke);border-radius:999px;padding:5px;backdrop-filter:blur(12px)}
  .pipsInner button{border:none;background:transparent;color:var(--faint);font-size:12.5px;font-weight:600;cursor:pointer;padding:7px 14px;border-radius:999px;transition:.2s;display:flex;align-items:center;gap:7px}
  .pipsInner button .n{width:19px;height:19px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:10px}
  .pipsInner button:hover{color:var(--dim)}
  .pipsInner button.active{color:var(--ink);background:var(--glass2);box-shadow:inset 0 0 0 1px var(--stroke)}
  .pipsInner button.done{color:var(--dim)}
  .pipsInner button.done .n{background:var(--ok);border-color:var(--ok);color:#06371f}

  .stage{position:absolute;inset:0;z-index:10}
  .halo{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(680px,70vw);height:min(680px,70vw);border-radius:50%;background:radial-gradient(circle,rgba(46,86,190,.5),transparent 68%);filter:blur(70px);z-index:0;pointer-events:none}
  .caption{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--faint);letter-spacing:.04em;z-index:20;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .caption::before{content:"";width:22px;height:1px;background:var(--stroke)}
  .caption::after{content:"";width:22px;height:1px;background:var(--stroke)}

  /* atmosphere */
  .atmo{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2) 52%,var(--bg3))}
  .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .atmo.hasimg .bgfallback{display:none}
  .bgfallback{position:absolute;inset:0}
  .waves{position:absolute;inset:-6%;width:112%;height:112%;animation:drift 46s ease-in-out infinite}
  .grain{position:absolute;inset:0;width:100%;height:100%;opacity:.55;mix-blend-mode:overlay}
  .vignette{position:absolute;inset:0;background:radial-gradient(125% 100% at 50% 40%,transparent 54%,var(--vg))}
  /* wave colors (ink default) */
  .waves .w1{fill:var(--wv1);opacity:.5}.waves .w2{fill:var(--wv2);opacity:.55}.waves .w3{fill:var(--wv3);opacity:.4}.waves .w4{fill:var(--wv4);opacity:.3}
  .sw{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(255,255,255,.25);flex-shrink:0}
  /* ---- LILAC THEME ---- */
  body.lilac{background:radial-gradient(95% 75% at 50% 16%,#45344f 0%,#2c2138 46%,#181120 100%);--ink:#FCFAFE;--dim:rgba(246,240,251,.88);--faint:rgba(246,240,251,.62);--glow:rgba(178,140,214,.55);--glass:rgba(255,255,255,.11);--glass2:rgba(255,255,255,.18);--stroke:rgba(255,255,255,.26);--stroke2:rgba(255,255,255,.48);--box:rgba(255,255,255,.16);--box-sh:0 6px 20px rgba(28,14,46,.32)}
  body.lilac .side{background:rgba(24,15,34,.55)}
  body.lilac .atmo{background:radial-gradient(120% 80% at 20% -5%,#8a6797 0%,transparent 55%),radial-gradient(120% 80% at 92% 8%,#7d5a8b 0%,transparent 50%),radial-gradient(130% 120% at 50% 122%,#463154 0%,transparent 62%),linear-gradient(180deg,#5b4368 0%,#6D537A 52%,#4a3758 100%)}
  body.lilac .waves .w1{fill:#a888c0}body.lilac .waves .w2{fill:#9878ac}body.lilac .waves .w3{fill:#cbb4de}body.lilac .waves .w4{fill:#b295c8}
  body.lilac .halo{background:radial-gradient(circle,rgba(150,110,182,.5),transparent 68%)}
  body.lilac .vignette{background:radial-gradient(125% 100% at 50% 38%,transparent 50%,rgba(22,12,32,.5))}
  body.lilac .tcard .ic{color:#ecdff6}
  body.lilac .btn.glass{background:#ffffff;border:1px solid rgba(255,255,255,.85);color:#3a2b46;box-shadow:0 14px 40px rgba(50,30,80,.42)}
  body.lilac .btn.glass:hover{background:#ffffff;box-shadow:0 20px 56px rgba(75,48,120,.55)}
  body.lilac .btn.glass .arrow{color:#3a2b46}
  /* ---- MIST (light) THEME ---- device-scoped so sidebar stays readable */
  body.stone .device,body.stone .desktop{--ink:#26262b;--dim:rgba(38,38,44,.74);--faint:rgba(38,38,44,.5);--glass:rgba(255,255,255,.64);--glass2:rgba(255,255,255,.92);--stroke:rgba(40,42,55,.14);--stroke2:rgba(40,42,55,.3);--glow:rgba(120,132,155,.26);--box:#ffffff;--box-sh:0 5px 18px rgba(40,44,60,.12)}
  body.stone .atmo{background:radial-gradient(120% 80% at 18% -8%,#d5dae2 0%,transparent 52%),radial-gradient(120% 80% at 95% 6%,#e2ded6 0%,transparent 48%),radial-gradient(130% 100% at 50% 122%,#ced3db 0%,transparent 55%),linear-gradient(180deg,#F8F6F2 0%,#F2F0EB 50%,#EDEFF1 100%)}
  body.stone .waves .w1{fill:#c3cad5;opacity:.4}body.stone .waves .w2{fill:#b3bbc8;opacity:.46}body.stone .waves .w3{fill:#d8dce3;opacity:.44}body.stone .waves .w4{fill:#c8cfd9;opacity:.32}
  body.stone .vignette{background:radial-gradient(125% 100% at 50% 40%,transparent 58%,rgba(70,78,92,.12))}
  body.stone .halo{background:radial-gradient(circle,rgba(150,162,182,.36),transparent 68%)}
  body.stone .homebar{background:rgba(40,42,55,.3)}
  body.stone .browserbar{background:#ebe8e2;border-bottom:1px solid rgba(40,42,55,.1)}
  body.stone .browserbar .urlpill{color:rgba(38,38,44,.7)}
  body.stone .btn.glass{background:#26262b;border:1px solid rgba(0,0,0,.06);color:#F6F4EF;box-shadow:0 12px 32px rgba(30,32,42,.3)}
  body.stone .btn.glass:hover{background:#34343b;box-shadow:0 18px 46px rgba(30,32,42,.42)}
  body.stone .btn.glass .arrow{color:#F6F4EF}
  body.stone .btn.glass::after{opacity:0}
  body.stone .opt.sel,body.stone .pcard.sel,body.stone .tcard.sel,body.stone .chip.sel{background:#eeece7;border-color:#26262b;box-shadow:0 6px 18px rgba(40,44,60,.16)}
  body.stone .opt.sel .box{background:#26262b;border-color:#26262b;color:#fff}
  body.stone .tcard .ic{color:#3a3a44;background:#eeece7}
  body.stone .pbar{background:rgba(40,42,55,.14)}
  body.stone .gotchip{background:rgba(64,140,104,.14);border-color:rgba(64,140,104,.4);color:#2f7a52}
  body.stone .gotchip .av{background:#2f7a52;color:#fff}
  body.stone .demandstrip{background:rgba(60,66,86,.08);border-color:rgba(60,66,86,.22);color:rgba(38,38,44,.78)}
  body.stone .demandstrip b{color:#26262b}
  /* ---- IRIS (blue->lilac periwinkle) THEME ---- device-scoped */
  body.iris .device,body.iris .desktop{--ink:#2a2a48;--dim:rgba(42,42,72,.75);--faint:rgba(42,42,72,.5);--glass:rgba(255,255,255,.66);--glass2:rgba(255,255,255,.92);--stroke:rgba(70,66,140,.15);--stroke2:rgba(70,66,140,.32);--glow:rgba(110,119,222,.34);--box:#ffffff;--box-sh:0 5px 18px rgba(70,66,150,.15)}
  body.iris .atmo{background:radial-gradient(120% 80% at 18% -8%,#d3d2f2 0%,transparent 52%),radial-gradient(120% 80% at 95% 6%,#dedcf4 0%,transparent 48%),radial-gradient(130% 100% at 50% 122%,#c8c6ef 0%,transparent 55%),linear-gradient(180deg,#F4F3FC 0%,#EEECFA 50%,#E9E7F7 100%)}
  body.iris .waves .w1{fill:#bcbcee;opacity:.42}body.iris .waves .w2{fill:#a9a9e6;opacity:.48}body.iris .waves .w3{fill:#d6d5f6;opacity:.46}body.iris .waves .w4{fill:#c4c3f1;opacity:.34}
  body.iris .vignette{background:radial-gradient(125% 100% at 50% 40%,transparent 58%,rgba(70,66,140,.1))}
  body.iris .halo{background:radial-gradient(circle,rgba(120,120,230,.4),transparent 68%)}
  body.iris .homebar{background:rgba(60,56,120,.3)}
  body.iris .browserbar{background:#e8e7f3;border-bottom:1px solid rgba(70,66,140,.1)}
  body.iris .browserbar .urlpill{color:rgba(42,42,72,.7)}
  body.iris .btn.glass{background:#6E77DE;border:1px solid rgba(0,0,0,.05);color:#fff;box-shadow:0 12px 32px rgba(110,119,222,.42)}
  body.iris .btn.glass:hover{background:#5c64ce;box-shadow:0 18px 46px rgba(110,119,222,.52)}
  body.iris .btn.glass .arrow{color:#fff}
  body.iris .opt.sel,body.iris .pcard.sel,body.iris .tcard.sel,body.iris .chip.sel{background:#eae9fb;border-color:#6E77DE;box-shadow:0 6px 18px rgba(110,119,222,.22)}
  body.iris .opt.sel .box{background:#6E77DE;border-color:#6E77DE;color:#fff}
  body.iris .tcard .ic{color:#6E77DE;background:#eae9fb}
  body.iris .pbar{background:rgba(70,66,140,.14)}body.iris .pbar>i{background:#6E77DE}
  body.iris .demandstrip{background:rgba(110,119,222,.08);border-color:rgba(110,119,222,.26);color:rgba(42,42,72,.78)}
  body.iris .demandstrip b{color:#2a2a48}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-3%,2.5%)}}

  /* phone */
  .phone{position:absolute;left:50%;top:48%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--pscale,1));transform-origin:center;border-radius:56px;padding:11px;background:linear-gradient(160deg,#20242e,#0b0d12);box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.04),inset 0 0 3px rgba(255,255,255,.15);z-index:5}
  .phone .device{position:absolute;inset:11px;border-radius:44px;overflow:hidden;display:flex;flex-direction:column}
  .phone .island{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:110px;height:31px;background:#000;border-radius:20px;z-index:40}
  .phone .homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);z-index:40}
  .statusbar{position:relative;z-index:35;display:flex;justify-content:space-between;align-items:center;padding:15px 28px 0;font-size:14px;font-weight:600;color:var(--ink)}
  .statusbar .r{display:flex;gap:6px;align-items:center}

  /* desktop */
  .desktop{position:absolute;left:50%;top:48%;width:1060px;height:680px;transform:translate(-50%,-50%) scale(var(--dscale,1));transform-origin:center;border-radius:16px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);z-index:5}
  .browserbar{position:relative;z-index:35;display:flex;align-items:center;gap:14px;padding:12px 16px;background:#0c1330;border-bottom:1px solid rgba(255,255,255,.08)}
  .dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%}
  .dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
  .urlpill{flex:1;max-width:420px;margin:0 auto;background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:8px;padding:6px 14px;font-size:12.5px;color:var(--dim);text-align:center}
  .desknav{position:relative;z-index:35;display:flex;align-items:center;gap:20px;padding:18px 34px}
  .desknav .segwrap{flex:1;max-width:340px;margin:0 auto}
  .deskbody{position:relative;z-index:20;flex:1;min-height:0;overflow-y:auto;display:flex;align-items:safe center;justify-content:center;padding:24px 34px 40px}
  .deskcol{width:100%;max-width:560px;color:var(--ink)}

  .segs{display:flex;gap:6px}
  .segs i{height:2.5px;border-radius:2px;background:rgba(255,255,255,.18);flex:1;overflow:hidden;position:relative}
  .segs i.on::after{content:"";position:absolute;inset:0;background:var(--ink);transform-origin:left;animation:fill .55s ease forwards}
  .segs i.past::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.55)}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .phone .segs{padding:16px 28px 0;position:relative;z-index:35}
  .pbar{flex:1;height:3px;background:rgba(255,255,255,.16);border-radius:2px;overflow:hidden}
  .pbar>i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .55s cubic-bezier(.4,0,.1,1)}
  .topicgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tcard{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1px solid var(--stroke);background:var(--box);box-shadow:var(--box-sh);border-radius:16px;cursor:pointer;transition:.2s;backdrop-filter:blur(8px);font-size:14px;font-weight:600;min-width:0}
  .tlabel{min-width:0;line-height:1.25}
  .tcard:hover{border-color:var(--stroke2);transform:translateY(-1px);background:var(--glass2)}
  .tcard.sel{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border-color:var(--stroke2);box-shadow:0 0 0 1px rgba(255,255,255,.2),0 10px 30px var(--glow)}
  .tcard .ic{width:34px;height:34px;border-radius:10px;background:var(--glass2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
  .capswitch{display:flex;gap:3px;background:var(--glass);border:1px solid var(--stroke);border-radius:999px;padding:4px;margin-bottom:18px;align-self:flex-start;backdrop-filter:blur(10px)}
  .capswitch button{border:none;background:transparent;color:var(--dim);font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.2s}
  .capswitch button.on{background:var(--glass2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--stroke)}
  @keyframes slideUp{from{opacity:0;transform:translateY(38px)}to{opacity:1;transform:none}}
  .capArea{animation:slideUp .5s cubic-bezier(.2,.75,.2,1)}
  .promptlist{display:flex;flex-direction:column;gap:10px}
  .pcard{display:flex;align-items:center;gap:12px;border:1px solid var(--stroke);background:var(--box);box-shadow:var(--box-sh);border-radius:16px;padding:15px 16px 15px 18px;cursor:pointer;transition:.2s;backdrop-filter:blur(8px);border-left:3px solid transparent}
  .pcard:hover{border-color:var(--stroke2);border-left-color:var(--accent);transform:translateY(-1px);background:var(--glass2)}
  .pc-go{margin-left:auto;color:var(--accent);font-size:17px;opacity:.5;transition:.2s;flex-shrink:0}
  .pcard:hover .pc-go{opacity:1;transform:translateX(3px)}
  .pcard.sel{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border-color:var(--stroke2);box-shadow:0 0 0 1px rgba(255,255,255,.2),0 10px 30px var(--glow)}
  .pc-main{font-size:15.5px;font-weight:500;line-height:1.4;color:var(--ink)}
  .peoplelist{display:flex;flex-direction:column;gap:10px}
  .pcard2{border:1px solid var(--stroke);background:var(--box);box-shadow:var(--box-sh);border-radius:16px;padding:14px 15px;transition:.2s;backdrop-filter:blur(8px)}
  .pcard2:hover{transform:translateY(-2px);border-color:var(--stroke2)}
  .pc-top{display:flex;align-items:center;gap:11px}
  .pav{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
  .pc-name{font-weight:600;font-size:15px}
  .pc-role{font-size:12.5px;color:var(--dim)}
  .pc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .ptag{font-size:11.5px;font-weight:500;color:var(--dim);background:var(--glass2);border:1px solid var(--stroke);border-radius:999px;padding:4px 10px}

     <div class="promptlist">${t.subs.map(s=>`<div class="pcard" onclick="choosePrompt('${s.replace(/'/g,"\\'")}')"><div class="pc-main">${s}</div><span class="pc-go">→</span></div>`).join("")}</div>
   </div>
   <div class="spacer"></div>
 </div>`;
}

function interview(){const sub=(state.subs[0]||"this").toLowerCase();return [
  {type:"single",eyebrow:`${state.l1||''}${state.subs[0]?' · '+state.subs[0]:''}`,prompt:`When it comes to ${sub}, what's the heart of your take?`,options:["A hard lesson I learned","A strong opinion I hold","A practical how-to","A personal story"],saymore:true},
  {type:"text",prompt:`Tell me about a moment that shaped how you see ${sub}.`,placeholder:"Start typing, or tap the mic and just talk…"},
  {type:"multi",prompt:"What made it stick with you?",options:["Something someone said","A mistake I made","A small detail others miss","How it turned out"],saymore:false},
  {type:"rate",prompt:"How strongly do you feel about this?",lo:"Still figuring it out",hi:"Very strongly"}];}

function s3(){const iv=interview();const total=iv.length;
 if(state.iStep>=total)return '';
 const q=iv[state.iStep];const pct=Math.round((state.iStep/total)*100)+12;
 let w="";
 if(q.type==="single"||q.type==="multi")w=`<div class="opts">${q.options.map(o=>`<div class="opt ${q.type==='single'?'single':''}" data-label="${o}" onclick="pOpt(this,'${q.type}')"><span class="box">✓</span><span>${o}</span></div>`).join("")}</div>${q.saymore?`<textarea class="saymore" rows="1" placeholder="+ say more (optional)"></textarea>`:""}`;
 else if(q.type==="text")w=`<textarea class="ta" id="tao" placeholder="${q.placeholder}"></textarea>
   <div class="reassure"><span class="ra-ic">${SPEECH}</span> Say it in your own words. WizzMe shapes it into your story.</div>
   <button class="exbtn" onclick="openEx()">${EYE} Preview a finished story</button>`;
 else w=`<div class="ratelbls"><span>${q.lo}</span><span>${q.hi}</span></div><div class="rate">${[1,2,3,4,5].map(n=>`<div class="r" onclick="pRate(this)">${n}</div>`).join("")}</div>`;
 const voice=q.type==="text";
 const c=state.chosen;
 const demand=(state.iStep===0&&c)?`<div class="demandstrip rise d1">${SPEECH} <b>People are asking about this.</b> Your answer reaches them.</div>`:"";
 return `<div class="screen"><div class="shhead"><span class="pill" onclick="panel()">📝 ${state.answers.length} answer${state.answers.length===1?'':'s'}</span><span class="stepn">${state.iStep} in</span></div>
   <div class="miniprog"><i style="width:${pct}%"></i></div>
   ${demand}
   ${q.eyebrow?`<div class="eyebrow rise d1" style="margin-bottom:10px">${q.eyebrow}</div>`:""}
   <h3 class="q rise d1">${q.prompt}</h3>
   <div class="rise d2">${w}</div>
   <div class="spacer"></div>
   <div class="composer"><button class="icb" title="Attach">${CLIP}</button>${voice?`<button class="vpill" id="vp" onclick="voiceT()"><span class="blip"></span> Voice</button>`:""}<div style="flex:1"></div><button class="skiplink" onclick="skipQ()">Skip</button><button class="btn glass nextb" onclick="ansQ()">Next <span class="arrow">→</span></button></div>
 </div>`;}

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function postCard(p){return `<div class="wzpost">
  <span class="wz-quote">”</span>
  <div class="wz-cover"><span class="cover-fallback"></span><img src="${p.img}" alt="" onerror="this.style.display='none'"></div>
  <div class="wz-in">
    <div class="wz-author">${p.author}</div>
    <h3 class="wz-title">${p.title}</h3>
    <p class="wz-body">${p.body}</p>
    <div class="wz-meta"><span>${CAL} Just now</span><span>${DOC} ${p.min} min read</span></div>
  </div></div>`;}
function storyFor(){
 const sub=(state.subs[0]||'getting hired').toLowerCase();
 return {author:`${state.name} Menon's story`,
  title:`What ${sub} really taught me`,
  body:`The hard part was never the plan. It was trusting myself to start. Here's what ${sub} actually taught me, and what I'd tell anyone standing where I stood.`,
  img:`https://picsum.photos/seed/${encodeURIComponent(sub)}/760/380`, min:3};
}
const EXAMPLE={author:"Meera K.'s story",title:"The scariest part of quitting wasn't the money",
 body:"I left a stable PM role to start up. Everyone warned me about runway. But the hardest morning was telling my parents I'd be okay, and meaning it. Here's what the first year actually taught me about betting on yourself.",
 img:"https://picsum.photos/seed/theleap/760/380", min:4};
function openEx(){const s=document.getElementById(state.view==='mobile'?'sheetP':'sheetD');const p=PALETTES[state.theme]||PALETTES.ink;s.style.setProperty('--accent',p.accent);s.style.setProperty('--wv1',p.mist[0]);s.style.setProperty('--wv4',p.mist[3]);s.innerHTML=`<div class="sheet-card"><button class="sheet-x" onclick="closeEx()">✕</button>${postCard(EXAMPLE)}</div>`;s.classList.add('open');}
function closeEx(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));}
function s4(){const st=storyFor();return `<div class="screen">
  <div class="eyebrow rise d1" style="text-align:center;margin-bottom:6px">You just built something</div>
  <h2 class="title rise d1" style="text-align:center;margin-bottom:24px">Your answer's become a story</h2>
  <div class="rise d2">${postCard(st)}</div>
  <div class="spacer"></div>
  <button class="btn glass rise d3" onclick="alert('saved to your profile')">✓&nbsp; Save this story on my profile</button>
  <button class="btn subtle rise d3" onclick="alert('→ into the app')">Not now, maybe later</button>
</div>`;}

function doLi(){state.linkedin=true;const g=document.getElementById('gotchip');if(g)g.classList.add('show');setTimeout(next,950);}
function pickWhere(key){state.whereAt=key;state.followUp=null;updateBasics();}
function pickFollow(el,val){state.followUp=val;el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');setTimeout(next,220);}
function changeWhere(){state.whereAt=null;state.followUp=null;updateBasics();}
function updateBasics(){const b=document.getElementById('basics');if(b)b.innerHTML=renderBasics();}
function pickRole(el){el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');}
function pickL1(t){state.l1=t;state.subs=[];render();}
function tSub(s){const i=state.subs.indexOf(s);if(i>=0)state.subs.splice(i,1);else if(state.subs.length<3)state.subs.push(s);render();}
function quickSub(l,s){state.l1=l;state.subs=[s];render();}
function chooseArea(n){state.l1=n;state.capStep=1;state.subs=[];state.chosen=null;render();}
function capBack(){state.capStep=0;state.subs=[];state.chosen=null;render();}
function choosePrompt(s){state.subs=[s];state.chosen={kind:'prompt',label:s};next();}
let curSel=[],curRate=null,rec=false;
function pOpt(el,t){if(t==='single'){el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');curSel=[el.dataset.label];}else{el.classList.toggle('sel');curSel=[...el.parentElement.querySelectorAll('.opt.sel')].map(o=>o.dataset.label);}}
function pRate(el){el.parentElement.querySelectorAll('.r').forEach(r=>r.classList.remove('sel'));el.classList.add('sel');curRate=el.textContent;}
function voiceT(){rec=!rec;const vp=document.getElementById('vp');if(!vp)return;if(rec){vp.classList.add('rec');vp.innerHTML='<span class="blip"></span> Listening… tap to stop';const t=document.getElementById('tao');if(t)t.value="We were down to two candidates. One had the perfect résumé; the other asked me a question I hadn't thought of, about how we'd handle a bad launch. That's the one I hired.";}else{vp.classList.remove('rec');vp.innerHTML='<span class="blip"></span> Voice';}}
function ansQ(){const iv=interview();const q=iv[state.iStep];let a="";if(q.type==='single'||q.type==='multi'){a=curSel.length?curSel.join(" · "):"(picked)";const sm=document.querySelector('.saymore');if(sm&&sm.value)a+=". "+sm.value;}else if(q.type==='text'){const t=document.getElementById('tao');a=(t&&t.value)?t.value:"(shared a story)";}else a=(curRate||"3")+"/5";state.answers.push({q:q.prompt,a});curSel=[];curRate=null;rec=false;state.iStep++;if(state.iStep>=iv.length){next();}else{render();}}
function skipQ(){curSel=[];curRate=null;state.iStep++;if(state.iStep>=interview().length){next();}else{render();}}
function addMore(){state.iStep=1;render();}
function skipAll(){state.screen=5;render();}
function panel(){if(!state.answers.length){alert('Answers collect here — editable anytime (the AnswersPanel).');return;}alert("Answers so far:\n\n"+state.answers.map((a,i)=>`${i+1}. ${a.q}\n → ${a.a}`).join("\n\n"));}

function render(){
 const active=Math.min(state.screen,5);const html=[s0,s1,sPeople,s2,s3,s4][state.screen]();
 if(state.view==='mobile'){document.getElementById('pbody').innerHTML=html;document.getElementById('psegs').innerHTML=segsHTML(active);}
 else{document.getElementById('dbody').innerHTML=html;document.getElementById('dsegs').innerHTML=segsHTML(active);}
 document.getElementById('pips').innerHTML=LABELS.map((l,i)=>`<button class="${i===state.screen?'active':''} ${i<state.screen?'done':''}" onclick="goTo(${i})"><span class="n">${i<state.screen?'✓':i+1}</span>${l}</button>`).join("");
 const list=NOTES[state.screen]||[];
}
function setView(v){state.view=v;document.getElementById('phoneFrame').classList.toggle('hidden',v!=='mobile');document.getElementById('desktopFrame').classList.toggle('hidden',v!=='desktop');document.getElementById('tMobile').classList.toggle('on',v==='mobile');document.getElementById('tDesktop').classList.toggle('on',v==='desktop');document.getElementById('caption').textContent=v==='mobile'?'iPhone · tap through the flow':'Desktop · wizzme.ai · tap through the flow';render();}
const PALETTES={
 ink:     {label:'Ink',     mode:'dark', ink:'238,244,255', accent:'#4f7ae6', glow:'96,150,255',  bg:['#08133c','#0a1638','#060f2c'], mist:['#5f8ff0','#4f7fe6','#79cfff','#6fa0ff']},
 lilac:   {label:'Lilac',   mode:'dark', ink:'244,238,252', accent:'#8b73dd', glow:'139,115,221', bg:['#241a3a','#2f2350','#1c1430'], mist:['#6a54b0','#5846a0','#8570cc','#6f5cc0']},
 twilight:{label:'Twilight',mode:'dark', ink:'236,234,252', accent:'#6a5fd8', glow:'120,105,225', bg:['#171a3a','#231f54','#12122e'], mist:['#5648b8','#4a3fa2','#7a6ede','#6355c8']},
 dawn:    {label:'Dawn',    mode:'light',ink:'40,36,64',    accent:'#6a5fd8', accentInk:'#fff', glow:'120,105,225', bg:['#F3F2FB','#ECEBF8','#E7E6F5'], mist:['#c9c6ee','#b8b4e6','#dad7f6','#c8c4f0']},
 nocturne:{label:'Nocturne',mode:'dark', ink:'236,234,252', accent:'#6a5fd8', glow:'120,105,225', bg:['#171a3a','#231f54','#12122e'], mist:['#5648b8','#4a3fa2','#7a6ede','#6355c8']},
 graphite:{label:'Graphite',mode:'dark', ink:'236,237,240', accent:'#e7e8ec', accentInk:'#1b1c20', glow:'150,155,170', bg:['#191a1e','#212227','#141519'], mist:['#4a4d57','#3d404a','#5c606c','#4f525d']},
 ember:   {label:'Ember',   mode:'dark', ink:'245,236,228', accent:'#e0864f', glow:'224,134,79',  bg:['#2b1e16','#37271d','#20150f'], mist:['#8a5138','#6f4028','#b06a45','#8a5638']},
 stone:   {label:'Stone',   mode:'light',ink:'38,38,44',    accent:'#41414a', glow:'80,84,100',   bg:['#F8F6F2','#F2F0EB','#EDEFF1'], mist:['#c3cad5','#b3bbc8','#d8dce3','#c8cfd9']},
 sand:    {label:'Sand',    mode:'light',ink:'42,34,26',    accent:'#B0552F', accentInk:'#FDF7EF', glow:'176,85,47', bg:['#F7F1E8','#F2EADC','#EFE7D8'], mist:['#d9c3a4','#cbb28c','#e6d6bd','#d7c2a0']}
};
function applyPalette(key){
 const p=PALETTES[key]||PALETTES.ink;state.theme=key;state.mode=p.mode;
 document.body.classList.toggle('nocturne',key==='nocturne');
 const dark=p.mode==='dark',ai=p.accentInk||'#fff';
 const v={
  '--ink':`rgb(${p.ink})`,'--dim':`rgba(${p.ink},.76)`,'--faint':`rgba(${p.ink},.5)`,
  '--accent':p.accent,'--accent-ink':ai,'--accent-sh':`rgba(${p.glow},.42)`,'--glow':`rgba(${p.glow},.4)`,
  '--bg1':p.bg[0],'--bg2':p.bg[1],'--bg3':p.bg[2],'--wv1':p.mist[0],'--wv2':p.mist[1],'--wv3':p.mist[2],'--wv4':p.mist[3],
  '--glass':dark?`rgba(${p.ink},.09)`:'rgba(255,255,255,.64)','--glass2':dark?`rgba(${p.ink},.16)`:'rgba(255,255,255,.92)',
  '--stroke':dark?`rgba(${p.ink},.2)`:`rgba(${p.ink},.15)`,'--stroke2':dark?`rgba(${p.ink},.36)`:`rgba(${p.ink},.3)`,
  '--box':dark?`rgba(${p.ink},.11)`:'#ffffff','--box-sh':dark?'0 6px 20px rgba(0,0,0,.34)':`0 5px 18px rgba(${p.ink},.16)`,
  '--vg':dark?'rgba(6,10,26,.5)':`rgba(${p.ink},.1)`
 };
 document.querySelectorAll('.phone .device, #desktopFrame').forEach(el=>{for(const k in v)el.style.setProperty(k,v[k]);});
 document.querySelectorAll('.halo').forEach(el=>el.style.background=`radial-gradient(circle,rgba(${p.glow},.5),transparent 68%)`);
 document.querySelectorAll('#palettes .pal').forEach(b=>b.classList.toggle('on',b.dataset.k===key));
 document.getElementById('brandMark').innerHTML=logo(30);document.getElementById('deskMark').innerHTML=logo(24);
 render();
}
function next(){if(state.screen<5){state.screen++;if(state.screen===3){state.capStep=0;state.l1=null;state.subs=[];state.chosen=null;}if(state.screen===4)state.iStep=0;render();}}
function goTo(i){state.screen=i;if(i===3)state.capStep=0;if(i===4)state.iStep=0;render();}
function reset(){Object.assign(state,{screen:0,linkedin:false,whereAt:null,followUp:null,l1:null,subs:[],answers:[],iStep:0,chosen:null,capStep:0});render();}
function toggleNotes(){document.getElementById('notes').classList.toggle('open');}

function fit(){
  const sideW=236, capOff=56, padY=44, padX=90;
  const availH=window.innerHeight-padY-capOff;
  const availW=window.innerWidth-sideW-padX;
  const root=document.documentElement.style;
  root.setProperty('--pscale', Math.min(1, availH/844, availW/390).toFixed(3));
  root.setProperty('--dscale', Math.min(1, availH/680, availW/1060).toFixed(3));
}
window.addEventListener('resize',fit);
document.getElementById('atmoP').innerHTML=atmoHTML();
document.getElementById('atmoD').innerHTML=atmoHTML();
document.getElementById('palettes').innerHTML=Object.entries(PALETTES).map(([k,p])=>`<button class="pal" data-k="${k}" onclick="applyPalette('${k}')"><span class="dot" style="background:${p.accent}"></span>${p.label}</button>`).join("");
fit();
applyPalette('nocturne');
</script>
</body>
</html>
